plugins {
  id 'java'
}

java {
  sourceCompatibility = '25'
  targetCompatibility = '25'
}

repositories {
  mavenCentral()

  flatDir {
    dirs 'Library'
  }
}

dependencies {
  implementation 'ch.nolix:nolix:0.0.0'
  implementation 'com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11'
  implementation 'io.netty:netty-all:4.2.17.Final'
}

sourceSets {
  main {
    java {
      srcDirs = ['Source']
    }

    resources {
      srcDirs = ['Resource']
    }
  }
}
